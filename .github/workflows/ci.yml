# CI pipeline.
#
# Ordering is deliberate: the fastest checks that can fail run first, so a
# formatting mistake costs 30 seconds rather than the full 10-minute matrix.
# Jobs that do not depend on each other run in parallel.
#
# Everything here also runs locally via `make check`, so CI failures are
# reproducible on a developer machine rather than being a remote mystery.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same ref. Without this, a branch with rapid
  # pushes queues N full matrices and starves everyone else's PRs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check app tests --output-format=github
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app tests
      - name: Mypy
        working-directory: backend
        # Type errors are reported but do not fail the build yet: the codebase
        # is being annotated incrementally, and a hard gate on day one means
        # the first contributor to touch an un-annotated module is blocked by
        # debt they did not create. Flip to blocking once coverage passes 90%.
        continue-on-error: true
        run: mypy app

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=70 -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend build and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Check bundle size
        working-directory: frontend
        # A hard budget on the shipped bundle. Dashboards get slower one
        # dependency at a time, and the only reliable way to prevent it is to
        # make the regression fail a build rather than show up in a quarterly
        # performance review.
        run: |
          BUDGET_KB=1200
          SIZE_KB=$(du -sk dist/assets | cut -f1)
          echo "Bundle: ${SIZE_KB}KB (budget ${BUDGET_KB}KB)"
          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Bundle size ${SIZE_KB}KB exceeds the ${BUDGET_KB}KB budget"
            exit 1
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          # Fail only on what is actionable now. Unfixed CVEs still appear in
          # the SARIF report for tracking, but blocking a deploy on a
          # vulnerability with no available patch just teaches people to skip
          # the gate.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: aicost-api:${{ github.sha }}
          # GitHub Actions layer cache: without it every build re-installs the
          # full dependency tree, which dominates the job's runtime.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: aicost-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot the API with synthetic data and exercise every dashboard endpoint
        working-directory: backend
        # Catches the class of failure unit tests cannot: import cycles,
        # startup ordering, and route wiring that only manifests in a running
        # process.
        run: |
          SEED_DEMO_DATA=true SEED_DEMO_DAYS=30 \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          for path in \
            "/health" \
            "/ready" \
            "/metrics" \
            "/api/v1/analytics/summary?days=30" \
            "/api/v1/analytics/breakdown?dimension=model&days=30" \
            "/api/v1/analytics/timeseries?days=30" \
            "/api/v1/analytics/tokens?days=30" \
            "/api/v1/analytics/heatmap?days=30" \
            "/api/v1/analytics/flow?days=30" \
            "/api/v1/forecast?horizon_days=30" \
            "/api/v1/optimize/recommendations?days=30" \
            "/api/v1/anomalies?days=30" \
            "/api/v1/governance/budgets" \
            "/api/v1/governance/chargeback?days=30" \
            "/api/v1/catalog/models" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")
            echo "${code}  ${path}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done
