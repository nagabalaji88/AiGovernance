# CI pipeline.
#
# Ordering is deliberate: the fastest checks that can fail run first, so a
# formatting mistake costs 30 seconds rather than the full 10-minute matrix.
# Jobs that do not depend on each other run in parallel.
#
# Everything here also runs locally via `make check`, so CI failures are
# reproducible on a developer machine rather than being a remote mystery.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same ref. Without this, a branch with rapid
  # pushes queues N full matrices and starves everyone else's PRs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.9"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check app tests --output-format=github
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app tests
      - name: Mypy
        working-directory: backend
        # Type errors are reported but do not fail the build yet: the codebase
        # is being annotated incrementally, and a hard gate on day one means
        # the first contributor to touch an un-annotated module is blocked by
        # debt they did not create. Flip to blocking once coverage passes 90%.
        continue-on-error: true
        run: mypy app

  backend-test:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Testing only the floor lets 3.9-only
        # regressions through on modern syntax; testing only the ceiling lets the
        # PEP 604 / StrEnum / dataclass-slots breakage this project just removed
        # creep straight back in. The middle versions are interpolation.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=70 -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend build and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Check bundle size
        working-directory: frontend
        # A hard budget on the shipped bundle. Dashboards get slower one
        # dependency at a time, and the only reliable way to prevent it is to
        # make the regression fail a build rather than show up in a quarterly
        # performance review.
        #
        # Source maps are excluded: they are ~4x the size of the code and are
        # only fetched when devtools is open, so counting them measures
        # something no user ever downloads and makes the budget meaningless.
        run: |
          BUDGET_KB=1200
          SIZE_KB=$(find dist/assets -type f ! -name '*.map' -printf '%s\n' \
            | awk '{total += $1} END {printf "%d", (total + 1023) / 1024}')
          echo "Shipped assets (excluding source maps): ${SIZE_KB}KB (budget ${BUDGET_KB}KB)"
          find dist/assets -type f ! -name '*.map' -printf '  %f  %s bytes\n' | sort
          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Bundle size ${SIZE_KB}KB exceeds the ${BUDGET_KB}KB budget"
            exit 1
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # First-party ecosystem auditors rather than a third-party scanning
      # action. Both ship from the registries whose packages they audit, so
      # there is no external action version to pin, drift, or have vanish out
      # from under CI — which is exactly how this job broke the first time.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          # Two venvs, deliberately. The project goes in one; pip-audit goes in
          # the other and inspects the first via --path.
          #
          # Installing pip-audit *alongside* the project (the obvious approach,
          # and what this job did first) silently adds 23 packages of its own —
          # requests, urllib3, filelock, msgpack and friends — and then reports
          # their advisories as though they were ours. The gate spent a full run
          # failing on vulnerabilities in the auditing tool itself.
          python -m venv /tmp/projenv
          python -m venv /tmp/auditenv
          /tmp/projenv/bin/pip install --upgrade --quiet pip setuptools wheel
          /tmp/projenv/bin/pip install --quiet .
          /tmp/auditenv/bin/pip install --quiet pip-audit

          SITE=$(/tmp/projenv/bin/python -c \
            "import sysconfig; print(sysconfig.get_paths()['purelib'])")

          # PYSEC-2026-1325 (ecdsa): no fixed version exists — the maintainers
          # treat constant-time operation as out of scope for a pure-Python
          # implementation. It reaches us transitively via python-jose, and the
          # affected ECDSA path is unused: tokens are signed with HS256 (HMAC),
          # set in core/config.py. Revisit if JWT_ALGORITHM moves to an ES*
          # curve, and see the follow-up note on replacing python-jose.
          #
          # Nothing else is suppressed. On Python 3.9 this job fails on 12
          # further advisories (starlette x5, orjson, click, python-dotenv, and
          # pip/setuptools) for which *no patched release supports 3.9* — every
          # fix requires >=3.10. That failure is accurate and is left visible on
          # purpose: allowlisting a dozen unpatchable CVEs to obtain a green
          # check would hide a real security position behind a tick. See the
          # Python-floor note in docs/ROADMAP.md.
          /tmp/auditenv/bin/python -m pip_audit --desc --path "$SITE" \
            --ignore-vuln PYSEC-2026-1325

      - name: Audit Node dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          echo "::group::All dependencies (advisory only)"
          npm audit || true
          echo "::endgroup::"
          # Gate on production dependencies only — those are what reaches a
          # user's browser. Dev-only advisories (build tooling, test runners)
          # are reported above but do not block, since they are absent from the
          # shipped artifact.
          #
          # Suppression is per-advisory rather than by lowering --audit-level,
          # so a genuinely relevant high cannot slip through behind a blanket
          # threshold. Each entry needs a reason; matching pip-audit's
          # --ignore-vuln, an explicit exception beats a weakened gate.
          python3 - <<'PY'
          import json, subprocess, sys

          # GHSA-qwww-vcr4-c8h2 — React Router "RSC Mode CSRF Bypass".
          # Applies only to React Server Components request handling. This is a
          # client-rendered SPA (createRoot + BrowserRouter, no SSR/RSC), so the
          # affected code path is never reached.
          #
          # It is also unavoidable: the open-redirect advisories affecting
          # <Link>/useNavigate span 6.0.0-7.17.0, while this one spans
          # 7.12.0-8.2.0, so no published version clears both. We take the one
          # in code we do not run over the one in code we do.
          ALLOWED = {"GHSA-qwww-vcr4-c8h2"}

          raw = subprocess.run(
              ["npm", "audit", "--omit=dev", "--json"],
              capture_output=True, text=True,
          ).stdout
          report = json.loads(raw)

          blocking = []
          for name, vuln in report.get("vulnerabilities", {}).items():
              for source in vuln.get("via", []):
                  if not isinstance(source, dict):
                      continue
                  advisory = source.get("url", "").rsplit("/", 1)[-1]
                  if advisory in ALLOWED:
                      print(f"ignored (documented): {advisory}  {name}")
                      continue
                  if source.get("severity") in {"high", "critical"}:
                      blocking.append(f"{name}: {source.get('severity')} {advisory} - {source.get('title')}")

          if blocking:
              for item in blocking:
                  print(f"::error::{item}")
              sys.exit(1)
          print("No unreviewed high or critical advisories in production dependencies.")
          PY

      # Secret scanning is handled by GitHub's native push protection on this
      # repository, so it is deliberately not duplicated here.
      - name: Verify no committed secrets or env files
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$|id_rsa'; then
            echo "::error::Credential-bearing file is tracked in git"
            exit 1
          fi
          echo "No credential files tracked."

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: aicost-api:${{ github.sha }}
          # GitHub Actions layer cache: without it every build re-installs the
          # full dependency tree, which dominates the job's runtime.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: aicost-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot the API with synthetic data and exercise every dashboard endpoint
        working-directory: backend
        # Catches the class of failure unit tests cannot: import cycles,
        # startup ordering, and route wiring that only manifests in a running
        # process.
        run: |
          SEED_DEMO_DATA=true SEED_DEMO_DAYS=30 \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          for path in \
            "/health" \
            "/ready" \
            "/metrics" \
            "/api/v1/analytics/summary?days=30" \
            "/api/v1/analytics/breakdown?dimension=model&days=30" \
            "/api/v1/analytics/timeseries?days=30" \
            "/api/v1/analytics/tokens?days=30" \
            "/api/v1/analytics/heatmap?days=30" \
            "/api/v1/analytics/flow?days=30" \
            "/api/v1/forecast?horizon_days=30" \
            "/api/v1/optimize/recommendations?days=30" \
            "/api/v1/anomalies?days=30" \
            "/api/v1/governance/budgets" \
            "/api/v1/governance/chargeback?days=30" \
            "/api/v1/catalog/models" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")
            echo "${code}  ${path}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done
