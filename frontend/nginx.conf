server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. CSP is deliberately strict: this app loads no external
    # scripts, fonts or images, so anything trying to is either a supply-chain
    # compromise or a bug. 'unsafe-inline' on style-src is required by the
    # runtime style injection Framer Motion performs; script-src has no such
    # exemption, which is where it actually matters.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed asset filenames are immutable by construction, so they can be
    # cached indefinitely. This is what makes a repeat visit cost one HTML
    # request rather than a full bundle re-download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached: it carries the references to the hashed
    # bundles, so a stale copy pins users to a previous deploy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — client-side routes have no file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
